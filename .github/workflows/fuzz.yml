name: fuzz

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 120 s per target on pull requests, 1800 s on the weekly schedule, or the dispatch input.
  SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '1800' || github.event.inputs.seconds || '120' }}

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Differential: C (ASan-instrumented, with coverage) against Rust.
          - target: diff
            c_sanitize: address,fuzzer-no-link
            rustflags: ""
          # Rust only: panics, overflow (debug assertions) and output invariants.
          - target: rust_only
            c_sanitize: ""
            rustflags: ""
          # C only, under ASan and UBSan.
          - target: c_only
            c_sanitize: address,undefined,fuzzer-no-link
            rustflags: -C linker=clang -C link-arg=-fsanitize=undefined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      - name: Seed corpus from corpus/
        run: cargo run -q -p fuzzdiff-harness --example seeds -- "fuzz/corpus/${TARGET}"
        env:
          TARGET: ${{ matrix.target }}
      - name: Fuzz
        run: |
          cargo fuzz run "${TARGET}" "fuzz/corpus/${TARGET}" -- \
            -max_total_time="${SECONDS_PER_TARGET}" -max_len=4096 -dict=fuzz/http.dict -print_final_stats=1
        env:
          TARGET: ${{ matrix.target }}
          CC: clang
          FUZZDIFF_C_SANITIZE: ${{ matrix.c_sanitize }}
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
      - name: Upload corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 30
